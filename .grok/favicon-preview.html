<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#888;font-family:sans-serif}
  .row{display:flex;gap:16px;align-items:end;padding:16px;background:#6e6a64}
  figure{margin:0;text-align:center;color:#fff;font-size:11px}
  img{display:block;background:
    linear-gradient(45deg,#ccc 25%,transparent 25%),
    linear-gradient(-45deg,#ccc 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#ccc 75%),
    linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0;background-color:#fff}
</style>
<div class="row">
  <figure><img width="16" height="16" src="/workspace/public/favicon.svg"><figcaption>16</figcaption></figure>
  <figure><img width="32" height="32" src="/workspace/public/favicon.svg"><figcaption>32</figcaption></figure>
  <figure><img width="64" height="64" src="/workspace/public/favicon.svg"><figcaption>64</figcaption></figure>
  <figure><img width="180" height="180" src="/workspace/public/favicon.svg"><figcaption>180</figcaption></figure>
</div>
